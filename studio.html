<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation Studio</title>
<!-- Cageside's animation studio (ANIMATION_PLAN.md, Phase 2). Open it from the dev server
     (py tools/devserver.py, then http://localhost:8765/studio.html). It loads the game in a hidden frame
     and uses the game's own figure and clip player, so what you see here is what plays in the fight cam.
     Saving writes anim/clips/<id>.json and the server puts it into the game. -->
<style>
:root { --bg: #0b0f15; --panel: #121821; --line: #263040; --ink: #dfe6f0; --soft: #8b97a8; --red: #ff4b3e; --blue: #3f8bff; --gold: #ffd23c; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 2; }
header h1 { font-size: 14px; margin: 0 10px 0 0; letter-spacing: .06em; text-transform: uppercase; }
select, input, button, textarea { background: #1a2130; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
input[type=number] { width: 70px; }
button { cursor: pointer; }
button:hover { border-color: #4a5568; }
button.on { border-color: var(--red); color: #fff; }
.sep { width: 1px; height: 22px; background: var(--line); }
#status { color: var(--soft); margin-left: auto; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
section { padding: 8px; }
canvas { display: block; width: 100%; background: #05070a; border-radius: 6px; margin-bottom: 8px; }
aside { border-left: 1px solid var(--line); padding: 10px 12px; height: calc(100vh - 46px); overflow: auto; position: sticky; top: 46px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); margin: 14px 0 6px; }
.row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.row label { color: var(--soft); min-width: 64px; }
.ch { display: grid; grid-template-columns: 64px repeat(3, 1fr); gap: 4px; align-items: center; margin: 2px 0; }
.ch span { color: var(--soft); font-size: 12px; }
.ch input { width: 100%; padding: 2px 4px; }
.ch.set span { color: var(--gold); }
.help { color: var(--soft); font-size: 12px; }
.checks div { margin: 2px 0; }
.bad { color: var(--red); } .ok { color: #5fd38d; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { height: auto; position: static; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Animation Studio</h1>
  <select id="clips" aria-label="Clip"></select>
  <button id="new">New</button>
  <button id="save">Save</button>
  <span class="sep"></span>
  <button id="play" title="Space">Play</button>
  <select id="speed" aria-label="Speed"><option value="0.1">0.1×</option><option value="0.25" selected>0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select>
  <button id="loop" class="on">Loop</button>
  <button id="onion" class="on">Onion skin</button>
  <button id="opp" class="on">Opponent</button>
  <button id="com" class="on">Balance</button>
  <select id="build" aria-label="Build"><option>light</option><option selected>average</option><option>heavy</option></select>
  <span id="status">Loading the game…</span>
</header>
<main>
  <section>
    <canvas id="stage" width="960" height="520"></canvas>
    <canvas id="timeline" width="960" height="96"></canvas>
    <div class="row"><label for="chan">Curve</label><select id="chan"></select><span class="help">Space play · ←/→ frame · [ ] key · K add key · Del delete key · Ctrl+S save. Drag the fists, feet and hips on a key.</span></div>
    <canvas id="curves" width="960" height="150"></canvas>
  </section>
  <aside>
    <h2>Clip</h2>
    <div class="row"><label for="cid">id</label><input id="cid"><label for="cref" style="min-width:auto">ref</label><select id="cref"></select></div>
    <div class="row"><label for="caim">aim</label><select id="caim"></select><label for="cat" style="min-width:auto">at</label><select id="cat"><option value="">(move's)</option><option>head</option><option>chin</option><option>body</option><option>ribs</option><option>thigh</option><option>calf</option><option>hips</option></select></div>
    <div class="row"><label for="cimp">impact</label><input id="cimp" type="number" step="5"><label for="crec" style="min-width:auto">recover</label><input id="crec" type="number" step="5"></div>
    <div class="row"><label for="ccL">lead foot</label><input id="ccL" placeholder="0-45, 118-300" style="flex:1"></div>
    <div class="row"><label for="ccR">rear foot</label><input id="ccR" placeholder="on the floor (ms)" style="flex:1"></div>
    <div class="row"><textarea id="cnote" rows="2" style="width:100%" placeholder="what the clip is"></textarea></div>
    <h2>Key</h2>
    <div class="row"><span id="kinfo" class="help">No key under the playhead.</span></div>
    <div class="row"><label for="kt">time</label><input id="kt" type="number" step="5"><label for="ktan" style="min-width:auto">tangent</label><select id="ktan"><option>auto</option><option>flat</option><option>step</option></select></div>
    <div class="row"><label for="kpose">pose</label><select id="kpose"></select></div>
    <div class="row"><button id="kadd">Add key here</button><button id="kdel">Delete key</button><button id="kclear" title="Back to the pose only">Clear changes</button></div>
    <h2>Channels <span class="help">(gold: set on this key)</span></h2>
    <div id="chans"></div>
    <h2>Checks</h2>
    <div class="checks" id="checks"></div>
  </aside>
</main>
<iframe id="game" src="cageside.html" hidden title="game"></iframe>
<script>
const $ = (s) => document.querySelector(s);
let FIG = null, ANIM = null;
const BUILDS = { light: { height: 66, reach: 67, weight: 140 }, average: { height: 71, reach: 73, weight: 185 }, heavy: { height: 76, reach: 80, weight: 255 } };
const S = { id: null, clip: null, C: null, t: 0, playing: false, speed: 0.25, loop: true, onion: true, opp: true, com: true, build: 'average', key: -1, drag: null, dirty: false, chan: 'handL.0', last: 0 };
const FRAME = 1000 / 60, GAP = 1.25, X0 = -0.6;
const stage = $('#stage'), sx = stage.getContext('2d'), tl = $('#timeline'), tx = tl.getContext('2d'), cv = $('#curves'), cx = cv.getContext('2d');
const PPM = 205, FLOOR = 470, X = (m) => 400 + m * PPM, Y = (m) => FLOOR - m * PPM;
const r3 = (v) => Math.round(v * 1000) / 1000;
const status = (msg) => { $('#status').textContent = msg; };

// ---------------------------------------------------------------- loading
$('#game').addEventListener('load', async () => {
  const G = $('#game').contentWindow.MMA && $('#game').contentWindow.MMA.fightview;
  if (!G || !G.anim) { status('The game has no animation player (is this the right cageside.html?)'); return; }
  FIG = G.figure; ANIM = G.anim;
  for (const k of ANIM.CH) for (let i = 0; i < k[1]; i++) $('#chan').add(new Option(k[0] + '.' + 'xyzw'[i], k[0] + '.' + i));
  $('#chan').value = S.chan;
  const poses = Object.keys(FIG.POSES);
  for (const p of poses) { $('#cref').add(new Option(p)); }
  $('#kpose').add(new Option('(the key before)', ''));
  for (const p of poses) $('#kpose').add(new Option(p));
  $('#caim').add(new Option('none', ''));
  for (const w of ['hand', 'foot', 'knee', 'elbow']) for (const sd of ['L', 'R']) $('#caim').add(new Option(w + ' ' + (sd === 'L' ? 'lead' : 'rear'), w + sd));
  await listClips();
  requestAnimationFrame(tick);
});
async function listClips(select) {
  const html = await (await fetch('/anim/clips/', { cache: 'no-store' })).text();
  const ids = [...html.matchAll(/href="([\w.-]+)\.json"/g)].map((m) => m[1]);
  const sel = $('#clips');
  sel.innerHTML = '';
  for (const id of ids) sel.add(new Option(id));
  const pick = select || S.id || ids[0];
  if (pick) { sel.value = pick; if (pick !== S.id) await loadClip(pick); }
}
async function loadClip(id) {
  if (S.dirty && !confirm('Leave ' + S.id + ' without saving?')) { $('#clips').value = S.id; return; }
  S.clip = await (await fetch('/anim/clips/' + id + '.json', { cache: 'no-store' })).json();
  S.id = id; S.t = 0; S.key = -1; S.dirty = false;
  compile(); fillClip(); status('Loaded ' + id);
}
function compile() {
  S.clip.keys.sort((a, b) => a.t - b.t);
  S.C = ANIM.compile(S.clip);
  S.key = keyAt(S.t);
}
const keyAt = (t) => S.clip.keys.findIndex((k) => Math.abs(k.t - t) < 3);
const dur = () => S.C.dur || 1;

// ---------------------------------------------------------------- the figure at a moment
function bodyNow() { return FIG.body(BUILDS[S.build]); }
function figAt(t, b) {
  const v = ANIM.sample(S.C, t);
  const pose = ANIM.poseOf(v), J = FIG.solve(pose, b);
  return Object.assign(FIG.place(J, X0, 1, false), { b, dir: 1, side: 'a', pose, J });
}
const onFloor = (sd, t) => { const c = S.clip.contacts && S.clip.contacts[sd]; return !c || c.some(([a, b]) => t >= a && t < b); };
const ballX = (g, sd) => g.pt['an' + sd][0] + (g.pt['to' + sd][0] - g.pt['an' + sd][0]) * 0.8;

function draw() {
  const W = stage.width, H = stage.height, b = bodyNow();
  sx.fillStyle = '#05070a'; sx.fillRect(0, 0, W, H);
  const bg = sx.createLinearGradient(0, 0, 0, FLOOR); bg.addColorStop(0, '#0b0f15'); bg.addColorStop(1, '#1b222d');
  sx.fillStyle = bg; sx.fillRect(0, 0, W, FLOOR);
  sx.fillStyle = '#2b313c'; sx.fillRect(0, FLOOR, W, H - FLOOR);
  // a metre grid
  sx.strokeStyle = 'rgba(255,255,255,0.05)'; sx.lineWidth = 1;
  for (let m = -2; m <= 3; m += 0.5) { sx.beginPath(); sx.moveTo(X(m), 0); sx.lineTo(X(m), FLOOR); sx.stroke(); }
  for (let m = 0.5; m <= 2; m += 0.5) { sx.beginPath(); sx.moveTo(0, Y(m)); sx.lineTo(W, Y(m)); sx.stroke(); }
  if (!S.C) return;
  const opp = S.opp ? Object.assign(FIG.figure('guard', FIG.body(BUILDS.average), X0 + GAP, -1, false, 'b'), {}) : null;
  // onion skin: where it was and where it's going, a few frames either side
  if (S.onion) {
    const off = S.off || (S.off = document.createElement('canvas')), oc = off.getContext('2d');
    off.width = W; off.height = H;
    for (const k of [-3, -2, -1, 1, 2, 3]) {
      const t = S.t + k * 2 * FRAME;
      if (t < 0 || t > dur()) continue;
      oc.clearRect(0, 0, W, H);
      FIG.draw(oc, [figAt(t, b)], X, Y, PPM, 0);
      sx.globalAlpha = 0.07 + 0.05 * (4 - Math.abs(k)); sx.drawImage(off, 0, 0); sx.globalAlpha = 1;
    }
  }
  const g = figAt(S.t, b);
  for (const f of opp ? [opp, g] : [g]) { sx.beginPath(); sx.ellipse(X(f.pt.P[0]), FLOOR + 3, 0.42 * PPM, 0.05 * PPM, 0, 0, Math.PI * 2); sx.fillStyle = 'rgba(0,0,0,0.45)'; sx.fill(); }
  FIG.draw(sx, opp ? [opp, g] : [g], X, Y, PPM, 0);
  // what the strike is aimed at (the fight cam bends it onto the real target from here)
  if (opp && S.clip.aim) {
    const at = S.clip.aim.at || 'head', P = opp.pt;
    const tp = at === 'body' || at === 'ribs' ? [P.Ch[0] - 0.14, (P.W[1] + P.Ch[1]) / 2] : at === 'hips' ? [P.P[0] - 0.15, P.P[1]] : at === 'thigh' ? [P.knL[0] - 0.05, (P.hpL[1] + P.knL[1]) / 2] : at === 'calf' ? [P.anL[0] - 0.05, (P.knL[1] + P.anL[1]) / 2] : [P.Hd[0] - 0.1, P.Hd[1]];
    sx.strokeStyle = 'rgba(255,210,60,0.7)'; sx.lineWidth = 1.5; sx.beginPath(); sx.arc(X(tp[0]), Y(tp[1]), 7, 0, Math.PI * 2); sx.stroke();
  }
  // balance: the centre of mass over the feet that are on the floor
  if (S.com) {
    const Wt = [['P', 0.3], ['Ch', 0.25], ['Hd', 0.08], ['knL', 0.1], ['knR', 0.1], ['anL', 0.03], ['anR', 0.03], ['elL', 0.03], ['elR', 0.03], ['fiL', 0.025], ['fiR', 0.025]];
    let mx = 0, my = 0, mw = 0;
    for (const [k, w] of Wt) { mx += g.pt[k][0] * w; my += g.pt[k][1] * w; mw += w; }
    mx /= mw; my /= mw;
    const feet = ['L', 'R'].filter((sd) => onFloor(sd, S.t));
    let inside = true;
    if (feet.length) {
      const xs = feet.flatMap((sd) => [g.pt['he' + sd][0], g.pt['to' + sd][0]]), lo = Math.min(...xs), hi = Math.max(...xs);
      inside = mx >= lo - 0.03 && mx <= hi + 0.03;
      sx.fillStyle = inside ? 'rgba(95,211,141,0.6)' : 'rgba(255,140,60,0.7)'; sx.fillRect(X(lo), FLOOR + 1, (hi - lo) * PPM, 4);
    }
    sx.strokeStyle = inside ? 'rgba(95,211,141,0.8)' : 'rgba(255,140,60,0.9)'; sx.setLineDash([4, 4]);
    sx.beginPath(); sx.moveTo(X(mx), Y(my)); sx.lineTo(X(mx), FLOOR); sx.stroke(); sx.setLineDash([]);
    sx.beginPath(); sx.arc(X(mx), Y(my), 5, 0, Math.PI * 2); sx.stroke();
  }
  // handles: on a key you can drag them
  const onKey = S.key >= 0;
  for (const [k, col] of handles()) {
    const p = g.pt[k];
    sx.beginPath(); sx.arc(X(p[0]), Y(p[1]), 6, 0, Math.PI * 2);
    sx.strokeStyle = col; sx.lineWidth = 2; sx.stroke();
    if (onKey) { sx.fillStyle = col; sx.globalAlpha = 0.35; sx.fill(); sx.globalAlpha = 1; }
  }
  sx.fillStyle = '#ff0'; sx.font = 'bold 13px system-ui'; sx.fillText(S.id + '  ' + Math.round(S.t) + ' ms  (frame ' + Math.round(S.t / FRAME) + ')' + (onKey ? '  · key ' + (S.key + 1) : ''), 12, 20);
  if (S.C.impact != null && Math.abs(S.t - S.C.impact) < FRAME) { sx.fillStyle = '#ffd23c'; sx.fillText('IMPACT', 12, 38); }
  S.g = g;
}
const handles = () => [['fiL', '#ffd23c'], ['fiR', '#ffd23c'], ['anL', '#5fd38d'], ['anR', '#5fd38d'], ['P', '#ff4b3e']];

// ---------------------------------------------------------------- timeline and curves
const TX = (t) => 20 + t / dur() * (tl.width - 40), TT = (x) => Math.max(0, Math.min(dur(), (x - 20) / (tl.width - 40) * dur()));
function drawTimeline() {
  const W = tl.width;
  tx.fillStyle = '#0b0f15'; tx.fillRect(0, 0, W, tl.height);
  if (!S.C) return;
  tx.fillStyle = '#8b97a8'; tx.font = '11px system-ui';
  const step = dur() > 600 ? 100 : 50;
  for (let t = 0; t <= dur(); t += step) { tx.fillRect(TX(t), 0, 1, 6); tx.fillText(t, TX(t) + 2, 14); }
  // contacts: when each foot is on the floor
  for (const [sd, y, name] of [['L', 52, 'lead'], ['R', 70, 'rear']]) {
    tx.fillStyle = '#1a2130'; tx.fillRect(20, y, W - 40, 12);
    const c = (S.clip.contacts && S.clip.contacts[sd]) || [[0, dur()]];
    tx.fillStyle = sd === 'L' ? 'rgba(95,211,141,0.55)' : 'rgba(95,211,141,0.35)';
    for (const [a, b] of c) tx.fillRect(TX(a), y, TX(Math.min(b, dur())) - TX(a), 12);
    tx.fillStyle = '#8b97a8'; tx.fillText(name, 2, y + 10);
  }
  // events
  for (const [t, col] of [[S.C.impact, '#ffd23c'], [S.C.recover, '#8b97a8']]) if (t != null) { tx.fillStyle = col; tx.fillRect(TX(t) - 1, 18, 2, 74); }
  // keys
  S.clip.keys.forEach((k, i) => {
    const x = TX(k.t), y = 32;
    tx.beginPath(); tx.moveTo(x, y - 8); tx.lineTo(x + 7, y); tx.lineTo(x, y + 8); tx.lineTo(x - 7, y); tx.closePath();
    tx.fillStyle = i === S.key ? '#ff4b3e' : k.tan === 'flat' ? '#dfe6f0' : k.tan === 'step' ? '#3f8bff' : '#9aa6b8'; tx.fill();
  });
  tx.fillStyle = '#ff4b3e'; tx.fillRect(TX(S.t) - 1, 0, 2, tl.height);
}
function drawCurves() {
  const W = cv.width, H = cv.height;
  cx.fillStyle = '#0b0f15'; cx.fillRect(0, 0, W, H);
  if (!S.C) return;
  const [ch, i] = S.chan.split('.'), j = ANIM.AT[ch] + +i, n = 240, vals = [];
  for (let s = 0; s <= n; s++) vals.push(ANIM.sample(S.C, s / n * dur())[j]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 0.05) { const m = (hi + lo) / 2; lo = m - 0.025; hi = m + 0.025; }
  const CY = (v) => H - 14 - (v - lo) / (hi - lo) * (H - 28);
  cx.strokeStyle = '#263040'; cx.beginPath(); cx.moveTo(20, CY(lo)); cx.lineTo(W - 20, CY(lo)); cx.moveTo(20, CY(hi)); cx.lineTo(W - 20, CY(hi)); cx.stroke();
  cx.fillStyle = '#8b97a8'; cx.font = '11px system-ui'; cx.fillText(r3(hi), 22, CY(hi) - 3); cx.fillText(r3(lo), 22, CY(lo) + 12);
  cx.strokeStyle = '#3f8bff'; cx.lineWidth = 2; cx.beginPath();
  vals.forEach((v, s) => { const x = TX(s / n * dur()); if (s) cx.lineTo(x, CY(v)); else cx.moveTo(x, CY(v)); });
  cx.stroke();
  S.C.K.forEach((k, q) => { cx.beginPath(); cx.arc(TX(k.t), CY(k.v[j]), 4, 0, Math.PI * 2); cx.fillStyle = q === S.key ? '#ff4b3e' : '#dfe6f0'; cx.fill(); });
  cx.fillStyle = '#ff4b3e'; cx.fillRect(TX(S.t) - 1, 0, 2, H);
}

// ---------------------------------------------------------------- the inspector
function fillClip() {
  const c = S.clip;
  $('#cid').value = c.id; $('#cref').value = c.ref || 'guard'; $('#cnote').value = c.note || '';
  const a = c.aim || {}, w = ['hand', 'foot', 'knee', 'elbow'].find((k) => a[k]);
  $('#caim').value = w ? w + a[w] : ''; $('#cat').value = a.at || '';
  $('#cimp').value = c.events && c.events.impact != null ? c.events.impact : '';
  $('#crec').value = c.events && c.events.recover != null ? c.events.recover : '';
  for (const sd of ['L', 'R']) $('#cc' + sd).value = c.contacts && c.contacts[sd] ? c.contacts[sd].map(([x, y]) => x + '-' + y).join(', ') : '';
  fillKey();
}
function fillKey() {
  const k = S.clip.keys[S.key];
  $('#kinfo').textContent = k ? 'Key ' + (S.key + 1) + ' of ' + S.clip.keys.length + (k.pose ? ', from ' + k.pose : '') : 'No key under the playhead (' + Math.round(S.t) + ' ms).';
  for (const id of ['#kt', '#ktan', '#kpose', '#kdel', '#kclear']) $(id).disabled = !k;
  if (k) { $('#kt').value = k.t; $('#ktan').value = k.tan || 'auto'; $('#kpose').value = k.pose || ''; }
  const v = k ? S.C.K[S.key].v : ANIM.sample(S.C, S.t), box = $('#chans');
  box.innerHTML = '';
  for (const [ch, n] of ANIM.CH) {
    const row = document.createElement('div');
    row.className = 'ch' + (k && k.set && k.set[ch] ? ' set' : '');
    row.innerHTML = '<span>' + ch + '</span>';
    for (let i = 0; i < 3; i++) {
      if (i >= n) { row.appendChild(document.createElement('i')); continue; }
      const inp = document.createElement('input');
      inp.type = 'number'; inp.step = /pelvis|spine|neck|toe/.test(ch) ? '0.05' : '0.01'; inp.value = r3(v[ANIM.AT[ch] + i]); inp.disabled = !k;
      inp.title = ch + ' ' + 'xyz'[i];
      inp.addEventListener('change', () => { setChannel(ch, i, +inp.value); });
      row.appendChild(inp);
    }
    box.appendChild(row);
  }
  runChecks();
}
function setChannel(ch, i, val) {
  const k = S.clip.keys[S.key];
  if (!k) return;
  const v = S.C.K[S.key].v, n = ANIM.CH.find((c) => c[0] === ch)[1];
  k.set = k.set || {};
  if (!k.set[ch]) k.set[ch] = Array.from({ length: n }, (_, q) => r3(v[ANIM.AT[ch] + q]));
  k.set[ch][i] = r3(val);
  changed();
}
function changed() { S.dirty = true; compile(); fillKey(); status(S.id + ' (not saved)'); }
const parseRanges = (s) => s.trim() ? s.split(',').map((r) => r.split('-').map((x) => +x.trim())).filter((r) => r.length === 2 && r.every(isFinite)) : null;
function readClip() {
  const c = S.clip;
  c.id = $('#cid').value.trim() || c.id; c.ref = $('#cref').value; c.note = $('#cnote').value;
  const aim = $('#caim').value;
  if (aim) { c.aim = { [aim.slice(0, -1)]: aim.slice(-1) }; if ($('#cat').value) c.aim.at = $('#cat').value; if (S.clip.aim && S.clip.aim.far) c.aim.far = S.clip.aim.far; } else delete c.aim;
  c.events = {};
  if ($('#cimp').value !== '') c.events.impact = +$('#cimp').value;
  if ($('#crec').value !== '') c.events.recover = +$('#crec').value;
  const L = parseRanges($('#ccL').value), R = parseRanges($('#ccR').value);
  if (L || R) { c.contacts = {}; if (L) c.contacts.L = L; if (R) c.contacts.R = R; } else delete c.contacts;
  changed();
}
for (const id of ['#cid', '#cref', '#caim', '#cat', '#cimp', '#crec', '#ccL', '#ccR', '#cnote']) $(id).addEventListener('change', readClip);
$('#kt').addEventListener('change', () => { const k = S.clip.keys[S.key]; if (!k) return; k.t = Math.max(0, Math.round(+$('#kt').value)); S.t = k.t; changed(); });
$('#ktan').addEventListener('change', () => { const k = S.clip.keys[S.key]; if (k) { k.tan = $('#ktan').value; changed(); } });
$('#kpose').addEventListener('change', () => { const k = S.clip.keys[S.key]; if (!k) return; if ($('#kpose').value) k.pose = $('#kpose').value; else delete k.pose; changed(); });
$('#kclear').addEventListener('click', () => { const k = S.clip.keys[S.key]; if (k) { delete k.set; changed(); } });
function addKey() {
  if (keyAt(S.t) >= 0) return;
  const pose = ANIM.poseOf(ANIM.sample(S.C, S.t)), set = {};
  for (const [ch] of ANIM.CH) set[ch] = pose[ch].map(r3);
  S.clip.keys.push({ t: Math.round(S.t), set });
  changed();
}
function delKey() {
  if (S.key <= 0 || S.key >= S.clip.keys.length - 1) { status('The first and last keys stay (they set the start and the length).'); return; }
  S.clip.keys.splice(S.key, 1);
  changed();
}
$('#kadd').addEventListener('click', addKey);
$('#kdel').addEventListener('click', delKey);

// checks: the feet that should be planted, and how fast the ends move
function runChecks() {
  const b = bodyNow(), out = [], step = FRAME;
  let slip = { L: 0, R: 0 }, prev = null, top = 0, off = 0, n = 0;
  for (let t = 0; t <= dur(); t += step) {
    const g = figAt(t, b);
    if (prev) {
      for (const sd of ['L', 'R']) if (onFloor(sd, t) && onFloor(sd, t - step)) slip[sd] += Math.abs(ballX(g, sd) - ballX(prev, sd));
      for (const k of ['fiL', 'fiR', 'anL', 'anR']) top = Math.max(top, Math.hypot(g.pt[k][0] - prev.pt[k][0], g.pt[k][1] - prev.pt[k][1]) / step * 1000);
    }
    prev = g; n++;
  }
  const cm = (v) => (v * 100).toFixed(1) + ' cm';
  out.push('<div class="' + (slip.L > 0.01 ? 'bad' : 'ok') + '">Lead foot moves ' + cm(slip.L) + ' while planted</div>');
  out.push('<div class="' + (slip.R > 0.01 ? 'bad' : 'ok') + '">Rear foot moves ' + cm(slip.R) + ' while planted</div>');
  out.push('<div>Fastest fist or foot: ' + top.toFixed(1) + ' m/s</div>');
  out.push('<div class="help">(In the fight cam planted feet are pinned, so a foot moving here gets a step instead.)</div>');
  $('#checks').innerHTML = out.join('');
}

// ---------------------------------------------------------------- dragging the figure
const mouse = (e, c) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
stage.addEventListener('mousedown', (e) => {
  if (!S.g) return;
  const [mx, my] = mouse(e, stage);
  const hit = handles().map(([k]) => k).find((k) => Math.hypot(X(S.g.pt[k][0]) - mx, Y(S.g.pt[k][1]) - my) < 12);
  if (!hit) return;
  if (S.key < 0) { addKey(); S.key = keyAt(S.t); }
  S.drag = hit; S.playing = false; $('#play').classList.remove('on');
});
window.addEventListener('mousemove', (e) => {
  if (!S.drag) return;
  const [mx, my] = mouse(e, stage), b = bodyNow(), s = b.s;
  const bx = (mx - 400) / PPM - X0, by = (FLOOR - my) / PPM;
  const k = S.clip.keys[S.key], v = S.C.K[S.key].v, pose = ANIM.poseOf(v);
  k.set = k.set || {};
  if (S.drag === 'P') k.set.root = [r3(bx / s), r3(by / s)];
  else if (S.drag[0] === 'a') { const ch = 'foot' + S.drag.slice(2); k.set[ch] = [r3(bx / s), r3(Math.max(0.06, by / s)), pose[ch][2]]; }
  else { const ch = 'hand' + S.drag.slice(2), Ch = FIG.solve(pose, b).pt.Ch; k.set[ch] = [r3((bx - Ch[0]) / s), r3((by - Ch[1]) / s), pose[ch][2]]; }
  S.dirty = true; compile(); status(S.id + ' (not saved)');
});
window.addEventListener('mouseup', () => { if (S.drag) { S.drag = null; fillKey(); } });

// the timeline: click to move the playhead, drag a key to move it in time
tl.addEventListener('mousedown', (e) => {
  if (!S.C) return;
  const [mx, my] = mouse(e, tl);
  const i = S.clip.keys.findIndex((k) => Math.abs(TX(k.t) - mx) < 8);
  if (i >= 0 && my > 20 && my < 46) { S.key = i; S.t = S.clip.keys[i].t; S.tdrag = i > 0 ? i : null; fillKey(); return; }
  S.t = TT(mx); S.scrub = true; S.key = keyAt(S.t); fillKey();
});
window.addEventListener('mousemove', (e) => {
  if (S.scrub) { S.t = TT(mouse(e, tl)[0]); S.key = keyAt(S.t); }
  else if (S.tdrag != null) { const k = S.clip.keys[S.tdrag]; k.t = Math.max(1, Math.round(TT(mouse(e, tl)[0]) / 5) * 5); S.t = k.t; S.dirty = true; S.C = ANIM.compile(Object.assign({}, S.clip, { keys: S.clip.keys.slice().sort((a, b) => a.t - b.t) })); }
});
window.addEventListener('mouseup', () => { if (S.scrub) { S.scrub = false; fillKey(); } if (S.tdrag != null) { S.tdrag = null; changed(); } });

// ---------------------------------------------------------------- controls
$('#clips').addEventListener('change', () => loadClip($('#clips').value));
$('#play').addEventListener('click', () => { S.playing = !S.playing; $('#play').classList.toggle('on', S.playing); if (S.playing && S.t >= dur()) S.t = 0; });
$('#speed').addEventListener('change', () => { S.speed = +$('#speed').value; });
for (const k of ['loop', 'onion', 'opp', 'com']) $('#' + k).addEventListener('click', () => { S[k] = !S[k]; $('#' + k).classList.toggle('on', S[k]); });
$('#build').addEventListener('change', () => { S.build = $('#build').value; runChecks(); });
$('#chan').addEventListener('change', () => { S.chan = $('#chan').value; });
$('#new').addEventListener('click', () => {
  if (S.dirty && !confirm('Leave ' + S.id + ' without saving?')) return;
  let id = 'newClip', n = 1;
  while ([...$('#clips').options].some((o) => o.value === id)) id = 'newClip' + ++n;
  S.clip = { id, ref: 'guard', note: '', keys: [{ t: 0, pose: 'guard', tan: 'flat' }, { t: 300, pose: 'guard', tan: 'flat' }], events: {} };
  S.id = id; S.t = 0; S.dirty = true; compile(); fillClip(); status(id + ' (new, not saved)');
});
// one key a line, so the files read (and diff) well
function format(c) {
  const lines = ['{'], keys = Object.keys(c).filter((k) => k !== 'keys');
  const order = ['id', 'ref', 'note', 'aim', 'keys', 'events', 'contacts'].filter((k) => k === 'keys' || keys.includes(k)).concat(keys.filter((k) => !['id', 'ref', 'note', 'aim', 'events', 'contacts'].includes(k)));
  order.forEach((k, i) => {
    const end = i < order.length - 1 ? ',' : '';
    if (k === 'keys') lines.push('  "keys": [\n' + c.keys.map((q) => '    ' + JSON.stringify(q)).join(',\n') + '\n  ]' + end);
    else lines.push('  ' + JSON.stringify(k) + ': ' + JSON.stringify(c[k]) + end);
  });
  return lines.join('\n') + '\n}\n';
}
async function save() {
  readClip();
  const c = S.clip;
  if (!/^[\w-]+$/.test(c.id)) { status('The id can only have letters, digits, _ and -'); return; }
  const r = await fetch('/anim/clips/' + c.id + '.json', { method: 'PUT', body: format(c) });
  if (r.ok) { S.dirty = false; S.id = c.id; status('Saved ' + c.id + ' and put it in the game'); await listClips(c.id); }
  else status('Saving failed: ' + r.status + ' ' + r.statusText + ' (is tools/devserver.py serving this page?)');
}
$('#save').addEventListener('click', save);
window.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { S.playing = false; $('#play').classList.remove('on'); S.t = Math.max(0, Math.min(dur(), S.t + (e.key === 'ArrowRight' ? FRAME : -FRAME))); S.key = keyAt(S.t); fillKey(); }
  else if (e.key === ']' || e.key === '[') { const ks = S.clip.keys, i = e.key === ']' ? ks.findIndex((k) => k.t > S.t + 2) : ks.map((k) => k.t < S.t - 2).lastIndexOf(true); if (i >= 0) { S.t = ks[i].t; S.key = i; fillKey(); } }
  else if (e.key === 'k' || e.key === 'K') { addKey(); }
  else if (e.key === 'Delete') { delKey(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
});
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

function tick(now) {
  const dt = Math.min(64, now - (S.last || now)); S.last = now;
  if (S.C && S.playing) {
    S.t += dt * S.speed;
    if (S.t > dur()) { if (S.loop) S.t = 0; else { S.t = dur(); S.playing = false; $('#play').classList.remove('on'); } }
    const k = keyAt(S.t); if (k !== S.key) { S.key = k; }
  }
  if (FIG) { draw(); drawTimeline(); drawCurves(); }
  requestAnimationFrame(tick);
}
</script>
